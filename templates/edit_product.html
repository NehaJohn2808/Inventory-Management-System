<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <h2>Inventory Management System</h2>

        <div>

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            |

            <a href="{{ url_for('products') }}">
                Products
            </a>

            |

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h1>Edit Product</h1>

        <form method="POST">

            <label>Product Name</label>

            <input
                type="text"
                name="name"
                value="{{ product[1] }}"
                required
            >


            <label>Category</label>

            <input
                type="text"
                name="category"
                value="{{ product[2] }}"
                required
            >


            <label>Price</label>

            <input
                type="number"
                name="price"
                step="0.01"
                value="{{ product[3] }}"
                required
            >


            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                min="0"
                value="{{ product[4] }}"
                required
            >


            <label>Supplier</label>

            <input
                type="text"
                name="supplier"
                value="{{ product[5] }}"
                required
            >


            <button type="submit">
                Update Product
            </button>

        </form>

    </div>

</body>

</html>
